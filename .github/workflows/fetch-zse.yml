name: Fetch ZSE Ticker

# Weekdays. Official ZSE hours: pre-open 09:00-09:30 CAT, market 09:30-13:00
# CAT, post-close 13:00-14:30 CAT (07:00-12:30 UTC) -- but the market-data
# API's actual publish lands later than that in practice; observed 13:00-13:30
# UTC (15:00-15:30 CAT), 30-60min past the official post-close end. So we run
# every 15min through that observed window to keep site latency low, plus
# sparser bookend checks either side in case a day's publish is early or
# unusually late. Each run only commits when the data actually changed, and
# the social post is deduped by trading day, so extra runs are cheap no-ops.
on:
  schedule:
    - cron: '15 11 * * 1-5'        # early check, well ahead of the usual window
    - cron: '*/15 12-14 * * 1-5'   # tight sweep across the observed publish window
    - cron: '15 15,16 * * 1-5'     # trailing checks in case of a late publish
  workflow_dispatch:

jobs:
  fetch-zse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow (EOD card render)
        run: pip install --quiet Pillow

      - name: Scrape ZSE daily closes (ticker)
        run: python3 scripts/fetch_zse.py

      - name: Fetch ZSE end-of-day Market Activity
        env:
          ZSE_API_BASE: ${{ secrets.ZSE_API_BASE }}
        run: python3 scripts/fetch_zse_market.py

      - name: Render ZSE end-of-day card
        run: python3 scripts/build_zse_eod_card.py

      - name: Post ZSE end-of-day card (best effort)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python3 scripts/post_zse_eod.py

      - name: Commit ZSE data + card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/zse-ticker.json data/zse-market-activity.json \
                  data/zse-history.json \
                  data/zse-eod-caption.txt data/.posted_zse_eod.json \
                  img/cards/zse/eod-latest.png img/cards/zse/eod-*.png 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update ZSE data + EOD card [automated]"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Pushed on attempt $i"
                exit 0
              fi
              echo "Push rejected — rebasing (attempt $i/5)"
              git pull --rebase origin main || exit 1
              sleep $((RANDOM % 4 + 2))
            done
            echo "All push attempts failed"
            exit 1
          fi
