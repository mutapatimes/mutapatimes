name: Kamativi mine
products: tin, tantalum, lithium
summary: The Kamativi mine was the largest tin mine in Zimbabwe. The mine is located in western Zimbabwe in Matabeleland North Province. The Kamativi mine has reserves amounting to 100 million tonnes of tin ore grading 0.28% tin thus resulting 0.28 million tonnes of tin. The tin and tantalum mine opened in 1936 and operated until 1994, when it closed due to lower tin prices on world markets. Since the mine's closure, local artisanal miners have worked the pegmatite for cassiterite and tantalite.
wikipedia: https://en.wikipedia.org/wiki/Kamativi_mine
