name: Vubachikwe
summary: Vumbachigwe is a village and a goldmine in Gwanda District, in the province of Matabeleland South, Zimbabwe. It is located along the Mtshabezi River about ten kilometres (6.2 mi) north-west of the town of Gwanda. According to the 1982 Population Census, the village had a population of 2,077. The village grew as the residential and commercial centre for the employees of the Vubachikwe gold mine.
wikipedia: https://en.wikipedia.org/wiki/Vubachikwe
