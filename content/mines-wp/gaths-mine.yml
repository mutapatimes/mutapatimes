name: Gaths Mine
operator_label: Mutumwa Mawere
location_label: Mashava
products: Asbestos
summary: 'Gaths Mine is an asbestos mine in Mashava, Masvingo Province, Zimbabwe, and is located 40 km west of Masvingo city. Gaths Mine as it is now collectively known as is a combination of three mines: King Mine and the now-defunct Temeraire and Gaths. The mine once employed around 1,500 people but as it stands, production has been stopped due to operational challenges. A few employees are left at the mine doing general maintenance. As of November 2011, workers had been without a salary for three years.'
wikipedia: https://en.wikipedia.org/wiki/Gaths_Mine
