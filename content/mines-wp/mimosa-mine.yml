slug: mimosa-mine
name: Mimosa Mine
operator_label: Mimosa Mining Company — 50% Sibanye-Stillwater and 50% Implats
location_label: Wedza sub-chamber of the Great Dyke, about 32 km west of Zvishavane
products: Platinum, palladium, rhodium and other PGMs; nickel, copper and cobalt
summary: The Mimosa mine is a large underground mine located in the southern part of Zimbabwe in the Zvishavane District of Midlands Province. Mimosa was the first platinum mine in the Great Dyke of Zimbabwe. It had, as of 2012, platinum reserves estimated at 7.9 million ozs of platinum. The mine produces around 120,000 oz of platinum/year.
wikipedia: https://en.wikipedia.org/wiki/Mimosa_mine
