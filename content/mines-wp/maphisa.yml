summary: Maphisa is a small town in the Matobo District of the province of Matabeleland South. It also serves as the seat of Matobo Rural District Council and ultimately the district's largest business centre and development node. Three kilometres west of Maphisa is the Bhalagwe mountain on the Maphisa to Matjilotje Road. Maphisa Town's economic activity includes extensive gold mining by both large scale and artisanal miners. There are also many informal miners locally known as 'oTsheketshe'. It also boasts in excess of a 1500 hectare intensive farming under pivot irrigation system. There is also extensive commercial ranching in its precinct. The legendary liberation fighter Joshua Mqabuko Nkomo's home village is 40km South West of Maphisa. The amenities found in Maphisa include a modern hotel, Minda Mission which provides education from primary to Advanced level. There are modern supermarkets, a referral Maphisa Hospital and Hlalani Kuhle suburb. King Mzilikazi's grave and Cecil John Rhodes's
  grave are 84km and 65km respectively North East of Maphisa. The Matobo national park, a World Heritage Site is located 50km North East of Maphisa. SADC Icrisat is located 70km North East of Maphisa.
