summary: Empress Mine Township is a populated place in the area formerly known as Salakuhle in Zhombe Communal Land, Kwekwe District of the Midlands Province in Zimbabwe. It is Zhombe's largest growth point yet officially it is rated second after Zhombe Joel, the current Zhombe District capital.
