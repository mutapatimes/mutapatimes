name: Gaika Mine
operator_label: "Historical operation "
location_label: Approximately 2 km south of Kwekwe CBD, Midlands Province
products: gold
summary: The Gaika Mine, now known as the Gaika Gold Fields, is situated in what
  was Chicago Farm just about 2 kilometres (1.2 mi) south of Kwekwe CBD. The
  Gaika Mine was the earliest mine developed in 1894, then Globe and Phoenix in
  1895–1900, the Eldorado in 1905, the Antelope in 1908, the Cam and Motor Mine
  in 1909, the Shamva Mine in 1909–1910, and numerous others during the period
  1895–1911.
wikipedia: https://en.wikipedia.org/wiki/Gaika_Mine
