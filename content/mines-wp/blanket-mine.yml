name: Blanket Mine
operator_label: Caledonia Mining Corporation
location_label: Near Gwanda, Matabeleland South Province
products: gold
summary: Blanket Mine is a village and mine in the province of Matabeleland
  South, Zimbabwe. It is located about 15 km north-west of Gwanda and 140 km
  south of Bulawayo. The village grew up around the eponymous gold mine and
  provides a residential and commercial centre. Its population at the time of
  the 1982 census was 1,346 people.
wikipedia: https://en.wikipedia.org/wiki/Blanket_Mine
