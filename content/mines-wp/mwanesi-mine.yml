name: Mwanesi mine
location_label: Midlands Province
products: Iron ore
summary: The Mwanesi mine is a large iron mine located in central Zimbabwe in the Midlands Province. Mwanesi represents one of the largest iron ore reserves in Zimbabwe and in the world having estimated reserves of 30 billion tonnes of ore grading 43% iron metal.
