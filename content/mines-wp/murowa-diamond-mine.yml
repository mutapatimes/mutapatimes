summary: The Murowa diamond mine is a diamond mine located in Mazvihwa, south central Zimbabwe, about 40 kilometres from the asbestos mining town of Zvishavane in the Midlands province. The mine is owned and operated by RZM Murowa (Private) Limited, a member of RioZim. The mine is a combination of open pit and underground construction. Current estimates put construction costs at $61 million USD and mine reserves are 19 million tonnes of ore, with an ore grade of 0.9 carats (180 mg) per tonne.
