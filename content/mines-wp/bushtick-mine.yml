name: Bushtick Mine
operator_label: Historical operation [BSAC]
location_label: Near Esigodini, Matabeleland South Province
products: gold
summary: Bushtick Mine was a gold mining operation established in the 1920s and
  operative through early 1950s in Essexvale District, Matabeleland in Southern
  Rhodesia. It was established by the British South Africa Company.
wikipedia: https://en.wikipedia.org/wiki/Bushtick_Mine
