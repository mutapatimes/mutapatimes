name: Marange diamond fields
operator_label: 'Zimbabwe Consolidated Diamond Company (ZCDC) '
location_label: Marange/Chiadzwa, Manicaland Province
products: diamonds
summary: 'The Marange diamond fields are an area of widespread small-scale diamond production in Chiadzwa, Mutare District, Zimbabwe. The hugely prolific fields are regarded by some experts as the world''s biggest diamond find in more than a century: "[a]lthough estimates of the reserves contained in this area vary wildly, some have suggested that it could be home to one of the world''s richest diamond deposits".'
wikipedia: https://en.wikipedia.org/wiki/Marange_diamond_fields
