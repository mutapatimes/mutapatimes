summary: Kyle College is an independent, co-educational, boarding and day school situated about 6 km from the centre of Masvingo on Capota Road on the Eastern side of the Shagashe river. It has views of the Ruvure, Nyuni and Nyanda hills to the South, and the Mangwandi granite dome in the North West.
