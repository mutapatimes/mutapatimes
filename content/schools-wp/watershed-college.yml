summary: 'Watershed College is a private boarding school situated near Marondera in Zimbabwe. The College provides secondary education as well as an Agricultural course for girls and boys between the ages of 13 and 19.

  Watershed College is a member of the Association of Trust Schools (ATS) and the Headmistress is a member of the Conference of Heads of Independent Schools in Zimbabwe (CHISZ).'
