summary: Midlands Christian College (MCC) is a private co-educational high
  school of about 450 pupils ranging from form 1 to form 6, located in the city
  of Gweru, Zimbabwe. The college has boarding facilities as well as providing
  for day-scholars. Its name refers to its location in the Midlands Province in
  central Zimbabwe.
