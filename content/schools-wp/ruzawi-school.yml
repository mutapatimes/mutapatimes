summary: Ruzawi School is an Anglican, independent, co-educational, preparatory, boarding school for children aged 6 to 12. It is located near the town of Marondera in Zimbabwe. Ruzawi, which was founded by Robert Grinham and Maurice Carver, has a pupil population ranging from 205 to 220 depending on the balance of boys and girls and the number of pupils in each age group. In the Infants' Department there is one class each for Grade One and Grade Two. An additional entry point at Grade Three enables there to be two classes from that level up to Grade 7. The school is situated some five kilometres south of Marondera in extensive grounds surrounded by many hectares of indigenous miombo woodland and exotic eucalyptus plantations.
