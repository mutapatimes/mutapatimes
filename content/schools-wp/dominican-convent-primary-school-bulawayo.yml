summary: Dominican Convent Primary School is a Catholic, independent, preparatory day school for girls in Bulawayo, Zimbabwe. The school was founded in 1895 by the Dominican Sisters, laying its claim to being the oldest school in Bulawayo and in Zimbabwe. Initially co-educational, the institution become a girls' school in the 1950s, when St. Thomas Aquinas Primary School was opened to cater for the boys.
