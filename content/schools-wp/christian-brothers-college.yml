summary: St. Patrick's Christian Brothers College, Bulawayo, commonly referred to as Christian Brothers College (CBC), is a private boys-only high school located in Bulawayo, Zimbabwe. It is a member of the Association of Trust Schools (ATS) and the Headmaster is a member of the Conference of Heads of Independent Schools in Zimbabwe (CHISZ). The school is considered amongst the best in Africa. It is located in Bulawayo, Zimbabwe's second largest city.
