summary: Goldridge College is a co-educational, independent, boarding and day
  senior school in Kwekwe, Zimbabwe. Opened in 2001, the school is located in
  the low-density suburb of Newtown and is in close proximity to Kwekwe Sports
  Club. The school is run by the Goldridge Schools Board of Governors, which
  similarly runs the nearby feeder school, Goldridge Primary.
