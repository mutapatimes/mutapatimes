summary: Falcon College is an independent boarding school for boys and girls
  aged 12–18 in the southern Matabeleland region of Zimbabwe. It was founded in
  1954 near Essexvale, Federation of Rhodesia and Nyasaland, 55 km southeast of
  Bulawayo on the remains of the Bushtick Mine. The College's graduates include
  a British member of parliament, surgeons and doctors, leaders of industry and
  commerce, soldiers, educators, and sportspeople.
