summary: Springvale House Preparatory School is an independent, preparatory,
  boarding and day school in Mashonaland East, Zimbabwe that was established in
  1952. The school shares facilities with Peterhouse Girls on the Springvale
  Estate of approximately 1,200 acres (490 ha) with Gosho Park, a conservation
  area on the estate, being adjacent to the two schools. The majority of the
  pupil population are boarders while the remainder are day scholars.
