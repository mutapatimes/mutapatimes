summary: Eaglesvale Senior School is a Christian, co-educational independent,
  boarding and day school situated on an estate approximately 40 hectares in
  Harare, Zimbabwe. It is 12 km south west of the Harare Central Business
  District. It shares the same estate with Eaglesvale Preparatory School which
  is the primary school.
