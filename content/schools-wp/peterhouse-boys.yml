summary: Peterhouse Boys' School is an independent, boarding high school for boys in Mashonaland East, Zimbabwe. The school was founded by Fred Snell in 1955 and is located on an estate that is shared with Calderwood Park, a conservation area and game park, outside Marondera. The school is one of the schools under the Peterhouse Group of Schools, the other schools being Peterhouse Girls' School, Springvale House Preparatory School and Peterhouse Nursery School. Peterhouse was ranked as one of the Top 10 High Schools in Zimbabwe in 2014. Additionally Peterhouse was ranked as one of the Spears Top 100 Private Schools in The World in 2025.
