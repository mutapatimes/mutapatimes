summary: Gateway High School is a Christian, co-educational, independent school in Emerald Hill, Harare, Zimbabwe. It has 700 students from Form 1 to Upper 6. The school had its first form 1 intake in 1991 and the first upper 6 class graduated in 1995 under the headship of Paul Revell, along with Marcus Chibisa and Ron Montague as his deputies. The school is located on Sam Nujoma Street.
