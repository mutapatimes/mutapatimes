summary: Lilfordia School is an independent, preparatory, boarding school for boys and girls in Mashonaland West, Zimbabwe. Lilfordia was established in 1909 by Agnes and Atherton Lilford. The school is notable for the producing talented cricketers such as Brendan Taylor and Trevor Madondo.
