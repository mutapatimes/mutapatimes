summary: St. George's College is a private Jesuit boys high school in Harare, Zimbabwe. The school, colloquially referred to as Saints or George's, is located along Borrowdale Road, in Harare. The land was donated to the Jesuits. This led to the relocation of the school site from Bulawayo to Harare, the foundation of St. George's College. On the same site, a preparatory primary school was established, called Hartmann House (HH). This site is next to the presidents house, which acts as the official Zimbabwe State House. The school motto is Ex Fide Fiducia, a Latin phrase meaning "From Faith Comes Confidence".
